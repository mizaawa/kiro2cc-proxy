services:
  kiro2cc-proxy:
    image: ghcr.io/${IMAGE_OWNER:-mizaawa}/kiro2cc-proxy:${IMAGE_TAG:-latest}
    build:
      context: .
    container_name: kiro2cc-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:5678:5678"
    volumes:
      - ./data:/app/config
    restart: unless-stopped
