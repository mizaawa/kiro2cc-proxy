services:
  kiro2cc-proxy:
    build:
      context: .
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
    container_name: kiro2cc-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:5678:5678"
    volumes:
      - ./data:/app/config
    restart: unless-stopped
